<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Imam Bichi Media - Admin Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f5f0df;
    }

    .login-box {
      width: 90%;
      max-width: 400px;
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,.15);
    }

    h1 {
      text-align: center;
      color: #087443;
      margin-bottom: 8px;
    }

    p {
      text-align: center;
      color: #777;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 8px;
      background: #087443;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #065d35;
    }

    #message {
      margin-top: 15px;
      color: #c00;
      font-size: 14px;
    }

    #dashboard {
      display: none;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div id="login">
      <h1>Admin Login</h1>
      <p>Imam Bichi Islamic Media</p>

      <input
        type="email"
        id="email"
        placeholder="Admin Email"
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
      >

      <button id="loginBtn">Login</button>

      <div id="message"></div>
    </div>

    <div id="dashboard">
      <h1>Admin Dashboard</h1>
      <p>Login successful.</p>

      <button id="logoutBtn">Logout</button>
    </div>

  </div>


  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    }
      from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


    const firebaseConfig = {
      apiKey: "AIzaSyC4vS0Y3N_qI5Q9YTA9hcrcRbg-Wo-GuO-4T4",
      authDomain: "imam-bichi-islamic-media.firebaseapp.com",
      projectId: "imam-bichi-islamic-media",
      storageBucket: "imam-bichi-islamic-media.firebasestorage.app",
      messagingSenderId: "87559095522",
      appId: "1:87559095522:web:4668efc5a419d014de8abb",
      measurementId: "G-LR92D06R4N"
    };


    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);


    const email = document.getElementById("email");
    const password = document.getElementById("password");
    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");

    const loginBox = document.getElementById("login");
    const dashboard = document.getElementById("dashboard");
    const message = document.getElementById("message");


    loginBtn.addEventListener("click", async () => {

      message.textContent = "";

      if (!email.value || !password.value) {
        message.textContent = "Please enter email and password.";
        return;
      }

      try {

        await signInWithEmailAndPassword(
          auth,
          email.value.trim(),
          password.value
        );

      } catch (error) {

        console.error(error);

        message.textContent =
          "Login failed: " + error.message;

      }

    });


    onAuthStateChanged(auth, (user) => {

      if (user) {

        loginBox.style.display = "none";
        dashboard.style.display = "block";

      } else {

        loginBox.style.display = "block";
        dashboard.style.display = "none";

      }

    });


    logoutBtn.addEventListener("click", async () => {
      await signOut(auth);
    });

  </script>

</body>
      </html>
