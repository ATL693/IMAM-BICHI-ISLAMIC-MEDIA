<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Imam Bichi Islamic Media - Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f5f0df;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .box {
      width: 92%;
      max-width: 400px;
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0,0,0,.15);
    }

    h1 {
      text-align: center;
      color: #087443;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #087443;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #065d35;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      color: #c62828;
      font-size: 14px;
    }

    #dashboard {
      display: none;
    }

    .card {
      background: #f8f8f8;
      padding: 15px;
      margin: 10px 0;
      border-radius: 10px;
    }

    .logout {
      background: #9b1c1c;
      margin-top: 15px;
    }
  </style>
</head>

<body>

<div class="box">

  <!-- LOGIN -->
  <div id="loginSection">

    <h1>Admin Login</h1>
    <div class="subtitle">
      Imam Bichi Islamic Media
    </div>

    <input
      type="email"
      id="email"
      placeholder="Admin Email"
      autocomplete="email"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button id="loginBtn">
      Login
    </button>

    <div id="message"></div>

  </div>


  <!-- DASHBOARD -->
  <div id="dashboard">

    <h1>Admin Dashboard</h1>

    <div class="card">
      📖 Karatuttuka
    </div>

    <div class="card">
      🎧 Audio
    </div>

    <div class="card">
      🎥 Video
    </div>

    <div class="card">
      📚 Littattafai
    </div>

    <div class="card">
      🖼️ Gallery
    </div>

    <div class="card">
      📢 Sanarwa
    </div>

    <div class="card">
      🕌 About Imam
    </div>

    <button class="logout" id="logoutBtn">
      Logout
    </button>

  </div>

</div>


<script type="module">

  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

  import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
  }
    from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


  // =========================
  // FIREBASE CONFIG
  // =========================

  const firebaseConfig = {
    apiKey: "AIzaSyC4vS0Y3N_qI5Q9YTA9hcrcRbg-Wo-GuT4",
    authDomain: "imam-bichi-islamic-media.firebaseapp.com",
    projectId: "imam-bichi-islamic-media",
    storageBucket: "imam-bichi-islamic-media.firebasestorage.app",
    messagingSenderId: "87559095522",
    appId: "1:87559095522:web:a2d9d783166f56aade8abb",
    measurementId: "G-J2QD3SRX5N"
  };


  // =========================
  // INITIALIZE FIREBASE
  // =========================

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);


  // =========================
  // ELEMENTS
  // =========================

  const loginSection =
    document.getElementById("loginSection");

  const dashboard =
    document.getElementById("dashboard");

  const email =
    document.getElementById("email");

  const password =
    document.getElementById("password");

  const loginBtn =
    document.getElementById("loginBtn");

  const logoutBtn =
    document.getElementById("logoutBtn");

  const message =
    document.getElementById("message");


  // =========================
  // LOGIN
  // =========================

  loginBtn.addEventListener("click", async () => {

    message.textContent = "";

    const emailValue = email.value.trim();
    const passwordValue = password.value;

    if (!emailValue || !passwordValue) {
      message.textContent =
        "Please enter your email and password.";
      return;
    }

    loginBtn.disabled = true;
    loginBtn.textContent = "Logging in...";

    try {

      await signInWithEmailAndPassword(
        auth,
        emailValue,
        passwordValue
      );

    } catch (error) {

      console.error(error);

      message.textContent =
        "Login failed: " + error.code;

      loginBtn.disabled = false;
      loginBtn.textContent = "Login";
    }

  });


  // =========================
  // AUTH STATE
  // =========================

  onAuthStateChanged(auth, (user) => {

    if (user) {

      loginSection.style.display = "none";
      dashboard.style.display = "block";

    } else {

      loginSection.style.display = "block";
      dashboard.style.display = "none";

    }

  });


  // =========================
  // LOGOUT
  // =========================

  logoutBtn.addEventListener("click", async () => {

    await signOut(auth);

  });

</script>

</body>
      </html>
