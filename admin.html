<!DOCTYPE html>
<html lang="ha">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Imam Bichi Islamic Media - Admin</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4efdf;
  color:#222;
}

.container{
  width:94%;
  max-width:1000px;
  margin:25px auto;
}

.box{
  background:#fff;
  padding:25px;
  border-radius:16px;
  box-shadow:0 5px 20px rgba(0,0,0,.12);
}

#loginBox{
  max-width:420px;
  margin:70px auto;
}

h1,h2{
  color:#087443;
}

.center{text-align:center}

input,textarea,select{
  width:100%;
  padding:13px;
  margin:7px 0 14px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
}

textarea{
  min-height:120px;
  resize:vertical;
}

button{
  border:0;
  padding:13px 18px;
  border-radius:8px;
  background:#087443;
  color:white;
  font-size:15px;
  cursor:pointer;
}

button:hover{
  background:#065d35;
}

button:disabled{
  opacity:.6;
}

.logout{
  background:#a11b1b;
}

.back{
  background:#555;
  margin-bottom:15px;
}

#dashboard{
  display:none;
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:15px;
  margin-top:25px;
}

.card{
  padding:25px 10px;
  background:#fafafa;
  border:1px solid #ddd;
  border-radius:12px;
  text-align:center;
  cursor:pointer;
  transition:.2s;
}

.card:hover{
  transform:translateY(-2px);
  box-shadow:0 5px 15px rgba(0,0,0,.12);
}

.icon{
  display:block;
  font-size:35px;
  margin-bottom:10px;
}

.section{
  display:none;
  margin-top:20px;
}

.message{
  margin-top:12px;
  padding:10px;
  border-radius:7px;
}

.success{
  background:#e6f7ec;
  color:#087443;
}

.error{
  background:#ffe5e5;
  color:#b00020;
}

.small{
  color:#777;
  font-size:14px;
}
</style>
</head>

<body>

<div class="container">

      </div>

<!-- ================= FIREBASE ================= -->

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  doc,
  getDoc,
  setDoc,
  serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


/* ================= FIREBASE CONFIG ================= */

const firebaseConfig = {

  apiKey:
  "AIzaSyC4vS0Y3N_qI5Q9YTA9hcrcRbg-Wo-GuT4",

  authDomain:
  "imam-bichi-islamic-media.firebaseapp.com",

  projectId:
  "imam-bichi-islamic-media",

  storageBucket:
  "imam-bichi-islamic-media.firebasestorage.app",

  messagingSenderId:
  "87559095522",

  appId:
  "1:87559095522:web:a2d9d783166f56aade8abb",

  measurementId:
  "G-J2QD3SRX5N"
};


/* ================= INITIALIZE ================= */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* ================= LOGIN ================= */

document
.getElementById("loginBtn")
.addEventListener("click", async () => {

  const email =
  document.getElementById("email").value.trim();

  const password =
  document.getElementById("password").value;

  const message =
  document.getElementById("loginMessage");

  if(!email || !password){

    message.textContent =
    "Cika email da password.";

    message.className =
    "message error";

    return;
  }

  const button =
  document.getElementById("loginBtn");

  button.disabled = true;
  button.textContent = "Logging in...";

  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

  }catch(error){

    console.error(error);

    message.textContent =
    "Login failed: " + error.code;

    message.className =
    "message error";

    button.disabled = false;
    button.textContent = "Login";
  }

});


/* ================= AUTH CHECK ================= */

onAuthStateChanged(auth, async (user) => {

  if(!user){

    document.getElementById(
      "loginBox"
    ).style.display = "block";

    document.getElementById(
      "dashboard"
    ).style.display = "none";

    return;
  }

  try{

    const userDoc =
    await getDoc(
      doc(db,"users",user.uid)
    );

    if(
      !userDoc.exists() ||
      userDoc.data().role !== "admin"
    ){

      alert("Ba ka da izinin Admin.");

      await signOut(auth);

      return;
    }

    document.getElementById(
      "loginBox"
    ).style.display = "none";

    document.getElementById(
      "dashboard"
    ).style.display = "block";

  }catch(error){

    console.error(error);

    alert(
      "An kasa tabbatar da Admin: "
      + error.message
    );

    await signOut(auth);
  }

});


/* ================= LOGOUT ================= */

document
.getElementById("logoutBtn")
.addEventListener("click", async () => {

  await signOut(auth);

});


/* ================= OPEN SECTION ================= */

window.openSection = function(id){

  document
  .querySelectorAll(".section")
  .forEach(section => {
    section.style.display = "none";
  });

  document.getElementById(id)
  .style.display = "block";

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

};


/* ================= CLOSE ================= */

window.closeSections = function(){

  document
  .querySelectorAll(".section")
  .forEach(section => {
    section.style.display = "none";
  });

};


/* ================= MESSAGE ================= */

function showMessage(id,text,success=true){

  const box =
  document.getElementById(id);

  box.textContent = text;

  box.className =
  success
  ? "message success"
  : "message error";
}


/* ================= SAVE LECTURE ================= */

window.saveLecture = async function(){

  const title =
  document.getElementById(
    "lectureTitle"
  ).value.trim();

  const category =
  document.getElementById(
    "lectureCategory"
  ).value;

  const description =
  document.getElementById(
    "lectureDescription"
  ).value.trim();

  const videoUrl =
  document.getElementById(
    "lectureVideo"
  ).value.trim();

  const imageUrl =
  document.getElementById(
    "lectureImage"
  ).value.trim();

  if(!title || !category){

    showMessage(
      "lectureMessage",
      "Saka Taken da Category.",
      false
    );

    return;
  }

  try{

    await addDoc(
      collection(db,"lectures"),
      {
        title,
        category,
        description,
        videoUrl,
        imageUrl,
        createdAt:serverTimestamp()
      }
    );

    showMessage(
      "lectureMessage",
      "An ajiye Karatu successfully."
    );

    document.getElementById(
      "lectureTitle"
    ).value="";

    document.getElementById(
      "lectureDescription"
    ).value="";

    document.getElementById(
      "lectureVideo"
    ).value="";

    document.getElementById(
      "lectureImage"
    ).value="";

  }catch(error){

    showMessage(
      "lectureMessage",
      error.message,
      false
    );
  }

};

window.saveAbout = async function(){

</script>
